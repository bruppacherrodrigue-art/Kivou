[project]
name = "signals"
version = "0.1.0"
description = "Award & Sales Signals — modèle canonique des adjudications publiques (CH + UE)"
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
    "pydantic>=2.9",
    # client HTTP du connecteur TED
    "httpx>=0.27",
    # XML venant d'un tiers : parseur durci contre les bombes d'entités
    "defusedxml>=0.7",
    "pypdf>=6.16.1",
    # Persistance SaaS — SQLAlchemy est utilisé en mode CORE uniquement (tables
    # et requêtes), jamais en ORM : le modèle canonique reste souverain.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Pilote PostgreSQL de production. Les tests tournent sur SQLite (stdlib) ; la
# compatibilité PostgreSQL du schéma est vérifiée par compilation du DDL.
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Pilote PostgreSQL : présent en dev pour que le dialecte de PRODUCTION soit
    # exerçable par les tests sans qu'aucun serveur ne tourne.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Domaine monétaire : `Decimal("1240000")` est la forme enseignée par le modèle
# (un float perd des centimes). La forme littérale reste volontaire, y compris
# quand le montant est entier — sinon les tests montreraient deux écritures.
ignore = ["FURB157"]

[tool.pytest.ini_options]
testpaths = ["tests"]
