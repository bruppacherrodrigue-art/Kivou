[project]
name = "signals"
version = "0.1.0"
description = "Award & Sales Signals — modèle canonique des adjudications publiques (CH + UE)"
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
    # `[email]` apporte `email-validator` : la validation d'adresse est pleine de
    # cas particuliers, et une expression régulière maison en raterait.
    "pydantic[email]>=2.13.5",
    # client HTTP du connecteur TED
    "httpx>=0.27",
    # XML venant d'un tiers : parseur durci contre les bombes d'entités
    "defusedxml>=0.7",
    "pypdf>=6.16.1",
    # Persistance SaaS — SQLAlchemy est utilisé en mode CORE uniquement (tables
    # et requêtes), jamais en ORM : le modèle canonique reste souverain.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Application HTTP — pydantic v2 natif, donc la même technologie que le
    # modèle canonique. Le client de test passe par httpx, déjà présent.
    "fastapi>=0.115",
    # Hachage de mot de passe Argon2id. Aucune cryptographie maison.
    "argon2-cffi>=23.1",
    # SDK Stripe officiel. Il n'est appelé que derrière la passerelle de
    # `signals.billing.gateway` : la suite de tests reste hors-ligne, et le SDK
    # ne sert qu'à la vérification de signature et aux appels réels.
    "stripe>=15.6.0",
]

[project.optional-dependencies]
# Serveur ASGI de production. Inutile aux tests : le client de test FastAPI
# appelle l'application en direct.
server = ["uvicorn[standard]>=0.30"]
# Pilote PostgreSQL de production. Les tests tournent sur SQLite (stdlib) ; la
# compatibilité PostgreSQL du schéma est vérifiée par compilation du DDL.
postgres = ["psycopg[binary]>=3.3.4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.5",
    # Pilote PostgreSQL : présent en dev pour que le dialecte de PRODUCTION soit
    # exerçable par les tests sans qu'aucun serveur ne tourne.
    "psycopg[binary]>=3.3.4",
    "aiosmtpd>=1.4.6",
    "trustme>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Domaine monétaire : `Decimal("1240000")` est la forme enseignée par le modèle
# (un float perd des centimes). La forme littérale reste volontaire, y compris
# quand le montant est entier — sinon les tests montreraient deux écritures.
ignore = ["FURB157"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette annonce sa future migration vers httpx2 dans son client de test.
    # L'avertissement concerne la dépendance, pas le code de Kivou, et il n'y a
    # rien à corriger ici tant que FastAPI n'a pas suivi.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
