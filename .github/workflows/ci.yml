name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Déterminer les suites utiles
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            printf 'backend=true\nfrontend=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          frontend=false
          while IFS= read -r path; do
            case "$path" in
              frontend/*) frontend=true ;;
              docs/*) ;;
              .github/*) backend=true; frontend=true ;;
              *) backend=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'backend=%s\nfrontend=%s\n' "$backend" "$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend · shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kivou_test
          POSTGRES_USER: kivou_test
          POSTGRES_PASSWORD: kivou_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kivou_test -d kivou_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KIVOU_TEST_POSTGRES_DSN: postgresql+psycopg://kivou_test:kivou_test_password@127.0.0.1:5432/kivou_test
    steps:
      - uses: actions/checkout@v7
      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchroniser les dépendances verrouillées
        run: uv sync --locked --extra postgres
      - name: Tests du shard
        run: ops/bin/kivou-pytest-shard.sh "${{ matrix.shard }}" 4
      - name: Lint
        if: matrix.shard == 0
        run: uv run ruff check .

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Tests
        run: npm test -- --run
      - name: Installer Chromium verrouillé
        run: npx playwright install --with-deps chromium
      - name: Régression visuelle des références
        run: npm run test:visual
      - name: Conserver les écarts visuels
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-diffs
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Build Founder Console
        run: npm run build:founder
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint

  decision:
    name: CI décisionnelle
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les suites demandées
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          [[ "$BACKEND" == success || "$BACKEND" == skipped ]]
          [[ "$FRONTEND" == success || "$FRONTEND" == skipped ]]
