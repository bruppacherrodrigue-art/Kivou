# CI Kivou — valider le code, rien d'autre.
#
# Ce workflow ne déploie pas, ne publie pas, ne touche pas à Stripe et ne
# détient aucun secret. Les tests backend et frontend sont conçus pour tourner
# hors ligne : si l'un d'eux réclamait un jour une clé réelle, ce serait un
# défaut d'isolation du test, pas une raison d'ajouter un secret ici.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Moindre privilège : lire le dépôt suffit à le tester.
permissions:
  contents: read

# Une poussée qui en suit une autre annule la précédente : inutile de payer deux
# fois pour un état déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12 · uv)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kivou_test
          POSTGRES_USER: kivou_test
          POSTGRES_PASSWORD: kivou_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kivou_test -d kivou_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KIVOU_TEST_POSTGRES_DSN: >-
        postgresql+psycopg://kivou_test:kivou_test_password@127.0.0.1:5432/kivou_test
    # À arbre backend identique, les runners partagés ont varié de 19 min 11 s à
    # 30 min 09 s, et les runs lentes censurées projetaient 66 min 04 s à
    # 71 min 59 s. Une marge de 20 % sur le pire cas donne 86 min 23 s ; 90 est
    # l'arrondi supérieur à cinq minutes. Réduire la suite reste suivi séparément.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Version EXACTE : `astral-sh/setup-uv` ne publie pas de tag majeur
      # flottant au-delà de `v7`. Un `@v10` ne se résout donc pas, et le job
      # échoue à la préparation, avant même de voir le code.
      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # `uv.lock` est la clé du cache : il change quand les dépendances
          # changent, et seulement à ce moment-là.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` échoue si `uv.lock` ne correspond plus à `pyproject.toml`.
      # C'est ce qui garantit que la CI teste EXACTEMENT les versions verrouillées
      # dans le dépôt, et non ce que PyPI publiait ce matin.
      - name: Synchroniser les dépendances verrouillées
        run: uv sync --locked --extra postgres

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

  frontend:
    name: Frontend (Node 24 · npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` et jamais `npm install` : il installe l'arbre exact du
      # verrou et échoue si le verrou et le manifeste divergent.
      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Tests
        run: npm test -- --run

      - name: Installer Chromium verrouillé
        run: npx playwright install --with-deps chromium

      - name: Régression visuelle des références
        run: npm run test:visual

      - name: Conserver les écarts visuels
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-diffs
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Build Founder Console
        run: npm run build:founder

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint
