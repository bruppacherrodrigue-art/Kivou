# Le fichier de verrou partagé par les trois groupes d'ingestion.
#
#   sudo cp ops/systemd/kivou-ingestion.tmpfiles.conf /etc/tmpfiles.d/kivou-ingestion.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/kivou-ingestion.conf
#
#     Pourquoi tmpfiles.d et pas un `mkdir` dans le service
#     ────────────────────────────────────────────────────
#     `/run` est un tmpfs : son contenu disparaît à chaque redémarrage. Un
#     fichier créé une fois à la main aurait donc disparu au premier reboot, et
#     les unités auraient échoué sans que rien n'explique pourquoi.
#
#     Les services tournent avec `ProtectSystem=strict`, qui rend toute la
#     hiérarchie en lecture seule sauf /dev, /proc et /sys — /run compris. Ils
#     ne peuvent donc pas créer le verrou eux-mêmes. Leur donner
#     `ReadWritePaths=/run` ouvrirait tout /run en écriture pour économiser un
#     fichier ; déclarer ce seul fichier ici est bien plus étroit.
f /run/kivou-ingestion.lock 0644 kivou kivou -
