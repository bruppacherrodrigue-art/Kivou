# Zones de limitation de débit Kivou (§18).
#   sudo cp ops/nginx/kivou-limits.conf /etc/nginx/conf.d/
#
# Une zone de 10 Mo suit environ 160 000 adresses — largement au-delà de ce que
# staging verra.
#
# Les valeurs visent l'ABUS, pas l'usage normal :
#
#   kivou_auth   5 req/min   connexion et inscription
#   kivou_reset  3 req/min   demande et confirmation de réinitialisation
#   kivou_api  120 req/min   reste de l'API ; un feed en charge celui-ci
#   kivou_hook 300 req/min   webhooks, large pour absorber les réessais
#
# Dépassement → 429, ce que la SPEC attend.

limit_req_zone $binary_remote_addr zone=kivou_auth:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=kivou_reset:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=kivou_api:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=kivou_hook:10m  rate=300r/m;

limit_req_status 429;
limit_conn_status 429;
