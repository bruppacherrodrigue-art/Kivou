# Kivou — refus par défaut des hôtes inconnus en production.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/kivou_access.log kivou_safe_json;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/kivou_access.log kivou_safe_json;
    ssl_reject_handshake on;
}
