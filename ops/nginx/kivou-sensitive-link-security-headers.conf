# En-têtes de sécurité Kivou pour les liens sensibles (§16).
#
#   sudo cp ops/nginx/kivou-sensitive-link-security-headers.conf /etc/nginx/
#
#     Pourquoi ce fichier existe séparément
#     ─────────────────────────────────────
#     Dans nginx, `add_header` ne s'hérite PAS dès qu'un bloc enfant en déclare
#     un à son tour. Une `location` qui pose son propre `Cache-Control` perd
#     donc, en silence, TOUS les en-têtes de sécurité du bloc serveur.
#
#     Le défaut a été observé en conditions réelles : la page d'accueil, servie
#     par `location = /index.html`, arrivait sans CSP ni `X-Frame-Options`,
#     alors que le bloc serveur les déclarait. Rien ne le signalait — il fallait
#     lire les en-têtes d'une vraie réponse.
#
#     D'où ce fichier : il est inclus dans chaque `location` sensible HTTPS et
#     conserve tous les en-têtes partagés avec une politique de référent plus
#     stricte.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy.
#
#   Pas de `unsafe-eval` : le bundle Vite de production n'en a pas besoin.
#   `unsafe-inline` ne concerne que les STYLES (attributs `style` générés par
#   React) ; les scripts n'en bénéficient jamais.
#
#   `connect-src 'self'` suffit : l'API partage l'origine du frontend.
#   `font-src 'self'` verrouille au niveau du navigateur ce que le design
#   system exige — les polices sont auto-hébergées, aucune requête tierce n'est
#   possible même si un import réapparaissait par erreur.
#   `form-action` autorise Stripe : sans cela, notre propre CSP bloquerait la
#   redirection de paiement.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; object-src 'none'" always;

# HSTS vit ICI, dans le fichier partagé, et non dans le seul bloc serveur.
#
# Placé au niveau serveur, il subissait exactement le défaut que ce fichier
# corrige : `location = /index.html` et `/assets/` déclarent leur propre
# `Cache-Control`, ce qui annulait l'héritage — et le DOCUMENT HTML, la
# première réponse que voit le navigateur et la seule qui compte vraiment pour
# HSTS, partait sans l'en-tête.
#
# Ce fichier n'est inclus que dans le bloc TLS : rien ne l'émet en clair.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
