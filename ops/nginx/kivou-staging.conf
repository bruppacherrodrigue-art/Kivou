# Kivou — reverse proxy nginx, gabarit de staging.
#
#   Remplacer STAGING_HOST par le nom d'hôte réel une fois le domaine délégué :
#
#       sed 's/STAGING_HOST/staging.kivou.eu/g' ops/nginx/kivou-staging.conf \
#           | sudo tee /etc/nginx/sites-available/kivou
#
#   Le certificat est obtenu par `certbot certonly --webroot`, et non par
#   `--nginx` : le mode `--nginx` réécrit le fichier de site, ce qui ferait
#   diverger le serveur du gabarit versionné ici. Avec `certonly`, certbot ne
#   touche qu'à /etc/letsencrypt et ce fichier reste la seule source de vérité.
#   Les chemins de certificat sont donc déclarés explicitement ci-dessous.
#
#     Le partage d'origine est le cœur de ce fichier
#     ──────────────────────────────────────────────
#     Le frontend et l'API sont servis sous la MÊME origine. C'est ce qui permet
#     au cookie de session de rester `SameSite=Lax` et à la validation d'origine
#     du backend de fonctionner sans CORS. Séparer les deux hôtes casserait les
#     deux mécanismes à la fois.

# ── Limitation de débit (§18) ────────────────────────────────────────────────
# Déclarée au niveau http ; à placer dans /etc/nginx/conf.d/kivou-limits.conf
# ou dans le bloc http principal.
#
#   limit_req_zone $binary_remote_addr zone=kivou_auth:10m   rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=kivou_reset:10m  rate=3r/m;
#   limit_req_zone $binary_remote_addr zone=kivou_api:10m    rate=120r/m;
#   limit_req_zone $binary_remote_addr zone=kivou_hook:10m   rate=300r/m;
#   limit_req_status 429;
#
# Les valeurs visent l'abus, pas l'usage. Une personne se connecte quelques fois
# par minute au pire ; 5/min avec une rafale de 3 laisse passer les fautes de
# frappe et arrête le bourrage d'identifiants.

server {
    listen 80;
    listen [::]:80;
    server_name STAGING_HOST;

    # Le seul trafic en clair autorisé est la validation ACME ; tout le reste
    # part en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen … ssl http2` et non la directive `http2 on;` : cette dernière
    # n'existe qu'à partir de nginx 1.25.1, et Ubuntu 24.04 LTS livre 1.24.
    # Sur 1.24, `http2 on;` fait échouer `nginx -t` avec « unknown directive ».
    # La forme retenue fonctionne sur les deux versions.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name STAGING_HOST;

    ssl_certificate     /etc/letsencrypt/live/STAGING_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGING_HOST/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/STAGING_HOST/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Taille des corps (§20) ───────────────────────────────────────────────
    # Kivou n'accepte aucun téléversement client. Les corps les plus gros sont
    # un profil de ciblage et un webhook Stripe, tous deux de l'ordre du kilo-
    # octet. 1 Mo laisse une marge confortable et ferme la porte à l'envoi de
    # corps arbitraires.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ── En-têtes de sécurité (§16) ───────────────────────────────────────────
    # Fichier PARTAGÉ, et non des `add_header` en ligne : dans nginx, une
    # `location` qui déclare son propre `add_header` annule l'héritage de tous
    # ceux du bloc serveur. Le défaut a été observé en conditions réelles — la
    # page d'accueil arrivait sans CSP. D'où l'inclusion, répétée dans chaque
    # `location` qui pose un en-tête à elle.
    include /etc/nginx/kivou-security-headers.conf;

    # HSTS reste ici : il n'a de sens que sur le bloc TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── ROUTES BACKEND ───────────────────────────────────────────────────────
    # Attention au piège : /billing/* est BACKEND, /checkout/* est FRONTEND.
    # Les deux se ressemblent et désignent des couches opposées.
    location ~ ^/(auth|me|target-icps|signals|billing|notification-preferences|health)(/|$) {
        limit_req zone=kivou_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    # Authentification : la limite la plus stricte.
    location = /auth/login {
        limit_req zone=kivou_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    location = /auth/signup {
        limit_req zone=kivou_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    # Réinitialisation de mot de passe : plus stricte encore. Ces deux routes
    # envoient un e-mail ou consomment un jeton ; les marteler est toujours un
    # abus.
    location = /auth/password-reset/request {
        limit_req zone=kivou_reset burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    location = /auth/password-reset/confirm {
        limit_req zone=kivou_reset burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    # Webhook Stripe : protégé contre l'abus, mais assez large pour absorber une
    # rafale de RÉESSAIS légitimes. Stripe répète un événement non acquitté avec
    # un recul exponentiel ; l'étrangler ferait perdre des synchronisations
    # d'abonnement.
    location = /webhooks/stripe {
        limit_req zone=kivou_hook burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    # ── FRONTEND ─────────────────────────────────────────────────────────────
    root /srv/kivou/frontend;
    index index.html;

    # Les actifs empreintés par le build ne changent jamais sous une même URL :
    # ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        include /etc/nginx/kivou-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        include /etc/nginx/kivou-security-headers.conf;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # `index.html` n'est JAMAIS mis en cache longuement : c'est lui qui pointe
    # vers les actifs empreintés. Le figer servirait l'ancien bundle après un
    # déploiement.
    location = /index.html {
        include /etc/nginx/kivou-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Repli SPA : toute autre adresse rend l'application, qui route côté client.
    # C'est ce qui fait fonctionner /app/*, /checkout/success et /login.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
