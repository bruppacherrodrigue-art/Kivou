# Paramètres réservés au mandataire de la console Founder.
#   sudo cp ops/nginx/kivou-founder-proxy-params.conf /etc/nginx/kivou-founder-proxy-params.conf
#
# Ce fragment ne peut pas inclure kivou-proxy-params.conf : nginx refuse deux
# directives scalaires proxy_read_timeout dans une même location.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Origin            $http_origin;
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout 120s;
proxy_buffering off;
proxy_redirect off;
