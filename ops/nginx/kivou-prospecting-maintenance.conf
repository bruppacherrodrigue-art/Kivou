# Server-level include, STAGING only. Install before restoring an old backend.
# Only return directives are used inside if (safe nginx rewrite subset).
# Keep /me, login, reads, billing webhooks and all public pages available.
set $kivou_prospecting_request "$request_method:$uri";
if ($kivou_prospecting_request ~ "^(POST|PUT|PATCH|DELETE):/(signals|companies)(/|$)") {
    return 503;
}
if ($kivou_prospecting_request ~ "^PATCH:/target-icps(/|$)") {
    return 503;
}
