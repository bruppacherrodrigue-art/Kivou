# Paramètres communs aux emplacements mandataires de Kivou.
#   sudo cp ops/nginx/kivou-proxy-params.conf /etc/nginx/kivou-proxy-params.conf

proxy_http_version 1.1;

# `Host` doit rester l'hôte PUBLIC : la validation d'origine du backend le
# compare à KIVOU_ALLOWED_ORIGIN, et uvicorn construit ses URL à partir de là.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# `Origin` est transmis TEL QUEL. Le réécrire ou le supprimer désarmerait la
# protection CSRF du backend, qui repose entièrement sur cet en-tête.
proxy_set_header Origin            $http_origin;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Le mandataire ne met rien en cache : les réponses sont propres à une session.
proxy_buffering off;
proxy_redirect off;
