# Kivou — redirection de l'hôte www vers l'hôte canonique de production.
#
# Avant toute activation, vérifier que le SAN du certificat stocké sous
# /etc/letsencrypt/live/PRODUCTION_HOST couvre exactement PRODUCTION_HOST et PRODUCTION_WWW_HOST :
#   openssl x509 -in /etc/letsencrypt/live/PRODUCTION_HOST/fullchain.pem -noout -ext subjectAltName

server {
    listen 80;
    listen [::]:80;
    server_name PRODUCTION_WWW_HOST;

    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/kivou_access.log kivou_safe_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://PRODUCTION_HOST$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PRODUCTION_WWW_HOST;

    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/kivou_access.log kivou_safe_json;

    ssl_certificate /etc/letsencrypt/live/PRODUCTION_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PRODUCTION_HOST/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/PRODUCTION_HOST/chain.pem;

    include /etc/nginx/kivou-production-security-headers.conf;

    return 301 https://PRODUCTION_HOST$request_uri;
}
