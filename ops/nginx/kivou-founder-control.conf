# Kivou Founder Console — unique private control surface.
#
# This vhost is deliberately bound to loopback. Cloudflare Tunnel is the only
# external route and Cloudflare Access authenticates the operator before the
# request reaches this process. There is no control.staging.kivou.eu twin.

server {
    listen 127.0.0.1:8081;
    server_name control.kivou.eu;

    # Root-owned file, mode 0640, containing only:
    #   set $kivou_founder_origin_secret "<random secret>";
    # The same value is provided to the Founder API through its environment.
    include /etc/kivou/founder-origin-secret.conf;

    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/access.log kivou_safe_json;

    root /srv/kivou-founder/frontend;
    index index.html;
    client_max_body_size 64k;

    include /etc/nginx/kivou-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    # Local process health only. The hostname itself remains protected by Access.
    location = /healthz {
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    # Only the dedicated Founder API is reachable. Customer routes and the
    # existing /internal endpoints are never proxied through this host.
    location ^~ /api/founder/ {
        limit_req zone=kivou_api burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        # Overwrite any caller-supplied value with the localhost proxy secret.
        proxy_set_header X-Kivou-Founder-Origin-Secret $kivou_founder_origin_secret;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/kivou-proxy-params.conf;
    }

    location /assets/ {
        include /etc/nginx/kivou-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/kivou-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
