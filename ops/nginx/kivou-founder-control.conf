# Kivou Founder Console — unique private control surface.
#
# The certificate is obtained with `certbot certonly --webroot`, so this
# versioned template remains the source of truth for both public listeners.

server {
    listen 80;
    listen [::]:80;
    server_name control.kivou.eu;

    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/access.log kivou_safe_json;

    # Never challenge Basic Auth over cleartext. Only ACME is served directly.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://control.kivou.eu$request_uri;
    }
}

server {
    # nginx 1.24 requires HTTP/2 on the listen directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name control.kivou.eu;
    server_tokens off;

    set $kivou_safe_request_path $kivou_safe_path_map;
    access_log /var/log/nginx/access.log kivou_safe_json;

    ssl_certificate /etc/letsencrypt/live/control.kivou.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.kivou.eu/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/control.kivou.eu/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    auth_basic "Kivou Founder Control";
    auth_basic_user_file /etc/kivou/founder.htpasswd;

    # Root-owned file, mode 0640, containing only:
    #   set $kivou_founder_origin_secret "<random secret>";
    # The same value is provided to the Founder API through its environment.
    include /etc/kivou/founder-origin-secret.conf;

    root /srv/kivou-founder/frontend;
    index index.html;
    client_max_body_size 64k;

    include /etc/nginx/kivou-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/kivou-proxy-params.conf;
        proxy_set_header X-Kivou-Founder-User $remote_user;
        proxy_set_header X-Kivou-Founder-Origin-Secret $kivou_founder_origin_secret;
    }

    # Only the dedicated Founder API is reachable. Customer routes and the
    # existing /internal endpoints are never proxied through this host.
    location ^~ /api/founder/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=kivou_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/kivou-proxy-params.conf;
        # Overwrite client-supplied identity and secret after the shared include.
        proxy_set_header X-Kivou-Founder-User $remote_user;
        proxy_set_header X-Kivou-Founder-Origin-Secret $kivou_founder_origin_secret;
    }

    # Fail closed instead of serving the SPA shell for unknown API/internal or
    # customer-SaaS paths. This host is not an alternate entry point to Kivou.
    location ^~ /api/ { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /app/ { return 404; }
    location ~ ^/(auth|me|target-icps|signals|companies|dashboard|billing|notification-preferences|account|webhooks)(/|$) {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/kivou-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/kivou-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
